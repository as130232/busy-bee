<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b21"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="amber" x1="0.1" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- 全出血深色底（可作 maskable） -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 六角後方柔光 -->
  <polygon points="406,256 331,385.9 181,385.9 106,256 181,126.1 331,126.1"
           fill="#f59e0b" opacity="0.28" filter="url(#glow)"/>

  <!-- 主六角（蜂巢細胞，琥珀漸層） -->
  <polygon points="406,256 331,385.9 181,385.9 106,256 181,126.1 331,126.1"
           fill="url(#amber)" stroke-linejoin="round"/>

  <!-- 內層六角細環（科技/精密感） -->
  <polygon points="351,256 303.5,338.3 208.5,338.3 161,256 208.5,173.7 303.5,173.7"
           fill="none" stroke="#7c2d12" stroke-opacity="0.38" stroke-width="11" stroke-linejoin="round"/>

  <!-- 中心核（bee 核心 / 錄音點） -->
  <circle cx="256" cy="256" r="31" fill="#0d0d10"/>
</svg>
